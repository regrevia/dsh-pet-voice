<!DOCTYPE html>
<!-- 悬浮窗专用：只有鲸鱼娘本体，画布之外全透明。窗口背景由原生设成 TRANSPARENT。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>pet</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;               /* 手势交给原生窗口处理 */
    }
    /* 竖构图形象（420x465）按宽度 contain 后会吃满整个窗口高度，气泡就没地方放了。
       解法：气泡出现时原生把窗口「往上」临时加高 30dp（只在气泡显示的那几秒），
       页面按 __petPad 把人物锚在加高之前的窗口里 —— 人一像素不动，气泡也不用压头顶。
       不能常驻加高：overlay 窗口内的区域会吃触摸，常驻加高等于在屏幕上留一条按不到的死区。
       下面这段下移让位保留成兜底：窗口贴着屏幕上沿长不出来、或页面留白没生效时才用。 */
    #stage {
      position: fixed; inset: 0;
      pointer-events: none;             /* 视频层不吃触摸，点哪都是点小人 */
      /* 让位只做「整体下移」，永远不缩放：缩放会让小人看起来在点下去那一下变小。
         位移量由 boot.js 按头顶到气泡下沿的距离算，上限取帧底透明留白的余量，
         所以永远只吃留白、不会真把人裁掉。 */
      transform-origin: 50% 0;
      transition: transform .42s cubic-bezier(.33,.72,.24,1);
      will-change: transform;
    }
    /* 位移量由 boot.js 在 say() 里按人物主体的实际上下边界算（window.__petBodyBox()）。
       窗口大小换了会自动跟着算，写死的是兜底值。 */
    body.has-bubble #stage { transform: translateY(var(--shift, 18px)); }
    /* 形象：两路 video 交叉淡化（换动作时先出画再切前台，不闪黑底）。
       素材是 420x465 的透明 VP9，object-fit: contain 撑满窗口不裁切 */
    .pet-video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
      opacity: 0;
      transition: opacity .12s linear;
      will-change: opacity, transform;
      pointer-events: none;
    }
    .pet-video.front { opacity: 1; }
    /* 说话气泡：固定贴在窗口顶部，高度上限只做兜底（实际高度由 JS 量） */
    #bubble {
      position: fixed; left: 6px; right: 6px; top: 2px;
      /* 固定卡片：任何长度的回复都占同一块 72px，窗口与舞台缩放都不跟着文字变。
         72 = 3 行 × 17.4 + 上下 padding 12 + 边框 2 + 5.8 余量：真机 68 时第三行句号还被
         overflow:hidden 切掉（WebView 的行盒比 1.45 略高），放到 72 才真放得下三行。 */
      height: 72px;
      max-height: none;
      box-sizing: border-box;
      padding: 6px 9px;
      border-radius: 12px;
      background: rgba(10, 26, 38, 0.92);
      border: 1px solid rgba(122, 218, 255, 0.55);
      color: #E6F4FF;
      font: 12px/1.45 -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
      overflow: hidden;
      opacity: 0; transform: translateY(-4px) scale(.96);
      transition: opacity .14s ease, transform .14s ease;
      pointer-events: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .38);
    }
    #bubble.show { opacity: 1; transform: none; }
    #bubbleText {
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-all;
    }
    #bubble .who { color: #7ADAFF; font-weight: 600; margin-right: 4px; }
  
  </style>
</head>
<body>
  <div id="stage">
    <video class="pet-video" muted playsinline preload="auto"></video>
    <video class="pet-video" muted playsinline preload="auto"></video>
  </div>
  <div id="bubble"><span class="who">大肥鱼</span><span id="bubbleText"></span></div>
  <script type="module" src="./boot.js"></script>
</body>
</html>
